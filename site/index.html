<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniPack Tool</title>
    <meta
      name="description"
      content="Download the latest macOS DMG for UniPack Tool."
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5d6a76;
        --line: #d9dee5;
        --accent: #0f7f6f;
        --accent-strong: #0b5f54;
        --blue: #2457c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(246, 247, 249, 0.96)),
          radial-gradient(circle at top left, rgba(15, 127, 111, 0.14), transparent 34%),
          var(--bg);
      }

      main {
        width: min(920px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-items: center;
        padding: 48px 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 40px;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 14px 36px rgba(23, 32, 42, 0.14);
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 7vw, 76px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.62;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 34px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 20px;
        border: 1px solid transparent;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background-color 160ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        color: #ffffff;
        background: var(--accent);
        box-shadow: 0 14px 28px rgba(15, 127, 111, 0.2);
      }

      .button.primary:hover {
        background: var(--accent-strong);
      }

      .button.secondary {
        color: var(--blue);
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.74);
      }

      .meta {
        min-height: 24px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 14px;
      }

      .preview {
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 22px 70px rgba(23, 32, 42, 0.12);
        display: grid;
        place-items: center;
      }

      .preview img {
        width: 116px;
        height: 116px;
        border-radius: 24px;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 28px, 560px);
          align-items: start;
          padding: 34px 0;
        }

        .shell {
          grid-template-columns: 1fr;
          gap: 30px;
        }

        .preview {
          order: -1;
          width: 150px;
          margin-top: 10px;
        }

        .preview img {
          width: 84px;
          height: 84px;
          border-radius: 18px;
        }

        p {
          font-size: 16px;
        }

        .actions {
          align-items: stretch;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-label="UniPack Tool download">
        <div>
          <div class="brand">
            <img
              src="https://raw.githubusercontent.com/EarlySummer2018/uniapp-packaging-tool/main/src-tauri/icons/128x128.png"
              alt=""
            />
            <span>macOS</span>
          </div>
          <h1>UniPack Tool</h1>
          <p>Download the latest macOS installer for uni-app offline packaging.</p>
          <div class="actions">
            <a
              class="button primary"
              href="https://github.com/EarlySummer2018/uniapp-packaging-tool/releases/latest/download/UniPack-Tool-macOS.dmg"
              >Download DMG</a
            >
            <a
              class="button secondary"
              href="https://github.com/EarlySummer2018/uniapp-packaging-tool/releases/latest"
              >Release notes</a
            >
          </div>
          <div class="meta">Universal macOS build from the latest GitHub Release.</div>
        </div>
        <div class="preview" aria-hidden="true">
          <img
            src="https://raw.githubusercontent.com/EarlySummer2018/uniapp-packaging-tool/main/src-tauri/icons/128x128.png"
            alt=""
          />
        </div>
      </section>
    </main>
  </body>
</html>
