name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and prepare release notes
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Resolve tag and generate changelog
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$INPUT_TAG"
          fi

          if [ -z "$release_tag" ]; then
            echo "Release tag is required."
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          git fetch --tags --force
          if git rev-parse -q --verify "$release_tag^{commit}" >/dev/null; then
            previous_tag="$(git describe --tags --abbrev=0 "$release_tag^{commit}^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              changelog_range="$previous_tag..$release_tag"
            else
              changelog_range="$release_tag"
            fi
            git log --no-merges --pretty=format:'%h%x1f%s%x1f%b%x1e' "$changelog_range" > commits.txt
          else
            git log -1 --pretty=format:'%h%x1f%s%x1f%b%x1e' "$GITHUB_SHA" > commits.txt
          fi

          node <<'NODE' > release-changelog.md
          const fs = require("fs");
          const repoSlug = process.env.GITHUB_REPOSITORY || "";
          const linkSha = (sha) => repoSlug
            ? `[${sha}](https://github.com/${repoSlug}/commit/${sha})`
            : sha;

          const linkifyRefs = (text) => {
            if (!repoSlug || !text) return text || "";
            return String(text).replace(/#(\d+)/g, `[#$1](https://github.com/${repoSlug}/issues/$1)`);
          };

          const raw = fs.readFileSync("commits.txt", "utf8");
          const chunks = raw
            .replace(/\n$/, "")
            .split("\x1e")
            .filter((chunk) => chunk.trim().length > 0);

          const commits = chunks.map((chunk) => {
            const [shaRaw, subjectRaw, ...bodyParts] = chunk.split("\x1f");
            const sha = (shaRaw || "").trim();
            const subject = linkifyRefs((subjectRaw || "").trim());
            const body = linkifyRefs(bodyParts.join("\x1f").trim());
            return { sha, subject, body };
          }).filter((c) => c.sha && c.subject);

          const categorize = (subject) => {
            const m = /^(\w+)(\(.*\))?:/i.exec(subject);
            if (!m) return "other";
            const type = (m[1] || "").trim().toLowerCase();
            return {
              feat: "feat",
              feature: "feat",
              fix: "fix",
              bugfix: "fix",
              perf: "perf",
              revert: "revert",
              docs: "docs",
              documentation: "docs",
              style: "style",
              refactor: "refactor",
              refactorings: "refactor",
              test: "test",
              build: "build",
              ci: "ci",
              chore: "chore"
            }[type] || "other";
          };

          const sections = {
            feat: { title: "## 新增功能", items: [] },
            fix: { title: "## 问题修复", items: [] },
            perf: { title: "## 性能优化", items: [] },
            revert: { title: "## 回滚", items: [] },
            docs: { title: "## 文档", items: [] },
            style: { title: "## 样式", items: [] },
            refactor: { title: "## 重构 / 优化", items: [] },
            test: { title: "## 测试", items: [] },
            build: { title: "## 构建 / 依赖", items: [] },
            ci: { title: "## 构建脚本 / CI", items: [] },
            chore: { title: "## 杂项", items: [] },
            other: { title: "## 其他变更", items: [] }
          };

          for (const commit of commits) {
            sections[categorize(commit.subject)].items.push(commit);
          }

          const formatItem = (commit) => {
            const base = `- ${linkSha(commit.sha)} ${commit.subject}`;
            if (!commit.body) return base;
            const body = commit.body
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean)
              .slice(0, 4)
              .join("\n");
            return `${base}\n\n${body.split(/\r?\n/).map((line) => `  ${line}`).join("\n")}`;
          };

          const parts = [];
          for (const section of Object.values(sections)) {
            if (!section.items.length) continue;
            parts.push(section.title, "");
            for (const commit of section.items) parts.push(formatItem(commit));
            parts.push("");
          }

          process.stdout.write(parts.length ? parts.join("\n").trim() : "## 其他变更\n\n（无提交）");
          NODE

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: release-changelog.md
          retention-days: 1

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
            deployment_target: "10.15"
          - target: aarch64-apple-darwin
            arch: arm64
            deployment_target: "11.0"
          - target: universal-apple-darwin
            arch: universal
            deployment_target: "11.0"
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS app and DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles app,dmg --ci --no-sign

      - name: Prepare macOS release assets
        run: |
          set -euo pipefail

          base="UniPack-Tool_${RELEASE_TAG}_macOS_${{ matrix.arch }}"
          target_root="src-tauri/target/${{ matrix.target }}/release"
          dmg_dir="$target_root/bundle/dmg"
          app_dir="$target_root/bundle/macos"
          mkdir -p release-assets

          dmg_path="$([ -d "$dmg_dir" ] && find "$dmg_dir" -type f -name '*.dmg' -print -quit || true)"
          app_path="$([ -d "$app_dir" ] && find "$app_dir" -maxdepth 1 -type d -name '*.app' -print -quit || true)"

          if [ -z "$dmg_path" ]; then
            echo "No DMG bundle was produced."
            exit 1
          fi

          if [ -z "$app_path" ]; then
            echo "No macOS .app bundle was produced."
            exit 1
          fi

          cp "$dmg_path" "release-assets/$base.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/$base.app.zip"
          ls -lh release-assets

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 1

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npm run tauri build -- --target $env:TAURI_TARGET --bundles nsis,msi --ci --no-sign

      - name: Prepare Windows release assets
        run: |
          $ErrorActionPreference = "Stop"

          $base = "UniPack-Tool_${env:RELEASE_TAG}_Windows_${{ matrix.arch }}"
          $targetRoot = Join-Path "src-tauri" "target\${{ matrix.target }}\release"
          $bundleRoot = Join-Path $targetRoot "bundle"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null

          $setup = Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Filter "*.exe" -Recurse -File | Select-Object -First 1
          if (-not $setup) {
            throw "No NSIS setup executable was produced."
          }
          Copy-Item $setup.FullName "release-assets\$base-setup.exe"

          $msi = Get-ChildItem -Path (Join-Path $bundleRoot "msi") -Filter "*.msi" -Recurse -File | Select-Object -First 1
          if (-not $msi) {
            throw "No MSI installer was produced."
          }
          Copy-Item $msi.FullName "release-assets\$base.msi"

          $exe = Get-ChildItem -Path $targetRoot -Filter "unipack-tool.exe" -File | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows executable was produced."
          }

          $portableDir = Join-Path "portable" $base
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe.FullName (Join-Path $portableDir "UniPack Tool.exe")
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath "release-assets\$base-portable.zip" -Force

          Get-ChildItem release-assets | Format-Table Name,Length

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 1

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-macos
      - build-windows
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: release-*
          merge-multiple: false

      - name: Prepare checksums and release notes
        run: |
          set -euo pipefail

          mkdir -p release-assets
          find downloaded-artifacts -type f -name 'release-changelog.md' -exec cp {} release-changelog.md \;
          find downloaded-artifacts -type f ! -name 'release-changelog.md' -exec cp {} release-assets/ \;

          if [ ! -s release-changelog.md ]; then
            echo "Release changelog artifact is missing."
            exit 1
          fi

          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          : > release-assets/SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            (cd release-assets && sha256sum "$name") >> release-assets/SHA256SUMS.txt
            (cd release-assets && sha256sum "$name" > "$name.sha256")
          done < <(find release-assets -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS.txt' -print0 | sort -z)

          node <<'NODE' > release-body.md
          const fs = require("fs");
          const changelog = fs.readFileSync("release-changelog.md", "utf8").trim();
          const files = fs.readdirSync("release-assets")
            .filter((name) => fs.statSync(`release-assets/${name}`).isFile())
            .sort((a, b) => a.localeCompare(b, "en"));

          const downloadNotes = [
            "## 下载",
            "",
            ...files.map((name) => `- \`${name}\``)
          ].join("\n");

          process.stdout.write([changelog, downloadNotes].filter(Boolean).join("\n\n"));
          NODE

          echo "Prepared release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update release
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UniPack Tool $RELEASE_TAG" \
              --notes-file release-body.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "UniPack Tool $RELEASE_TAG" \
              --notes-file release-body.md \
              --latest
          fi

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
          echo "Published $RELEASE_TAG"
