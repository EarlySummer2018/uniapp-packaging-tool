name: Build and publish macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build universal macOS app
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          dmg_path="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"

          if [ -z "$dmg_path" ]; then
            echo "No DMG bundle was produced."
            exit 1
          fi

          cp "$dmg_path" release-assets/UniPack-Tool-macOS.dmg
          shasum -a 256 release-assets/UniPack-Tool-macOS.dmg > release-assets/UniPack-Tool-macOS.dmg.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: UniPack Tool ${{ github.ref_name }}
          body: |
            Download `UniPack-Tool-macOS.dmg` below.
          files: |
            release-assets/UniPack-Tool-macOS.dmg
            release-assets/UniPack-Tool-macOS.dmg.sha256
          draft: false
          prerelease: false
