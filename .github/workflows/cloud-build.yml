name: UniPack Cloud Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Unique UniPack build id
        required: true
      platform:
        description: android or ios
        required: true
      payload_release_tag:
        description: Temporary GitHub Release tag containing payload asset
        required: true
      payload_asset_name:
        description: Payload asset name
        required: true
      artifact_name:
        description: Artifact name expected by the desktop client
        required: true
      sdk_fingerprint:
        description: SHA-256 fingerprint used for the extracted SDK cache key
        required: true
      compile_sdk_version:
        description: Android compileSdkVersion (ignored for iOS)
        required: true

# The desktop client matches workflow_runs.display_title exactly.
run-name: ${{ inputs.build_id }}

jobs:
  cloud-build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      UNIPACK_SDK_CACHE_DIR: ${{ github.workspace }}/.unipack-sdk-cache
      SDK_FINGERPRINT: ${{ inputs.sdk_fingerprint }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        env:
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
          RELEASE_TAG: ${{ inputs.payload_release_tag }}
          ASSET_NAME: ${{ inputs.payload_asset_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          COMPILE_SDK_VERSION: ${{ inputs.compile_sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_BUILD_ID}" =~ ^[A-Za-z0-9._-]{1,120}$ ]] \
            || [[ ! "${EXPECTED_PLATFORM}" =~ ^(android|ios)$ ]] \
            || [[ ! "${SDK_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid cloud build identity or SDK fingerprint" >&2
            exit 1
          fi
          if [ "${EXPECTED_PLATFORM}" = "android" ] \
            && [[ ! "${COMPILE_SDK_VERSION}" =~ ^[0-9]{2,3}$ ]]; then
            echo "invalid Android compileSdkVersion" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "unipack-cloud-build-${EXPECTED_BUILD_ID}" ] \
            || [ "${ASSET_NAME}" != "payload-${EXPECTED_BUILD_ID}.zip" ] \
            || [ "${ARTIFACT_NAME}" != "unipack-${EXPECTED_BUILD_ID}" ]; then
            echo "temporary release, payload asset, or artifact does not match build_id" >&2
            exit 1
          fi

      - name: Restore extracted SDK cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UNIPACK_SDK_CACHE_DIR }}
          key: ${{ runner.os }}-unipack-sdk-${{ inputs.platform }}-${{ env.SDK_FINGERPRINT }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Android native build dependencies
        if: inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Java 17
        if: inputs.platform == 'android'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform required by project
        if: inputs.platform == 'android'
        env:
          COMPILE_SDK_VERSION: ${{ inputs.compile_sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK_VERSION}"

      - name: Verify iOS build environment
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --find xcodebuild
          pod --version

      - name: Build UniPack cloud runner
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin unipack-cloud-build

      - name: Download payload and delete temporary release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.payload_release_tag }}
          ASSET_NAME: ${{ inputs.payload_asset_name }}
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
          EXPECTED_COMPILE_SDK_VERSION: ${{ inputs.compile_sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_release() {
            local attempt
            for attempt in 1 2 3; do
              if gh release delete "${RELEASE_TAG}" --repo "${OWNER_REPO}" --cleanup-tag --yes >/dev/null 2>&1; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          trap 'cleanup_release || true' EXIT
          release_json="$(gh api "repos/${OWNER_REPO}/releases/tags/${RELEASE_TAG}")"
          asset_id="$(printf '%s' "${release_json}" | jq -r --arg name "${ASSET_NAME}" '.assets[] | select(.name == $name) | .id')"
          if [ -z "${asset_id}" ] || [ "${asset_id}" = "null" ]; then
            echo "payload asset not found: ${ASSET_NAME}" >&2
            exit 1
          fi
          gh api "repos/${OWNER_REPO}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" > payload.zip
          unzip -p payload.zip payload.json > payload-metadata.json
          payload_version="$(jq -r '.version' payload-metadata.json)"
          payload_build_id="$(jq -r '.buildId' payload-metadata.json)"
          payload_platform="$(jq -r '.platform' payload-metadata.json)"
          sdk_fingerprint="$(jq -r '.sdkCache.fingerprint' payload-metadata.json)"
          payload_compile_sdk="$(jq -r '.projectConfig.android.compileSdkVersion' payload-metadata.json)"
          if [ "${payload_version}" != "2" ]; then
            echo "unsupported payload version: ${payload_version}; expected 2" >&2
            exit 1
          fi
          if [ "${EXPECTED_PLATFORM}" = "android" ] \
            && [ "${payload_compile_sdk}" != "${EXPECTED_COMPILE_SDK_VERSION}" ]; then
            echo "payload compileSdkVersion does not match workflow input" >&2
            exit 1
          fi
          if [ "${payload_build_id}" != "${EXPECTED_BUILD_ID}" ] \
            || [ "${payload_platform}" != "${EXPECTED_PLATFORM}" ] \
            || [ "${sdk_fingerprint}" != "${SDK_FINGERPRINT}" ]; then
            echo "payload identity does not match workflow inputs" >&2
            exit 1
          fi
          if ! cleanup_release; then
            echo "failed to delete temporary signing release after retries" >&2
            exit 1
          fi
          trap - EXIT

      - name: Run UniPack cloud build
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          exec src-tauri/target/debug/unipack-cloud-build payload.zip

      - name: Remove signing material and temporary workspace
        if: always()
        shell: bash
        run: |
          rm -rf payload.zip payload-metadata.json .unipack-cloud-work

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            cloud-output/**/*.apk
            cloud-output/**/*.aab
            cloud-output/**/*.ipa
          if-no-files-found: error
          retention-days: 1
