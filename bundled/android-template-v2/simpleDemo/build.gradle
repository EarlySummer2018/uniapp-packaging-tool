plugins {
    id 'com.android.application'
}

android {
    namespace 'io.dcloud.uniapp'  // UNIPACK_REPLACE:package_name
    compileSdk 36  // UNIPACK_REPLACE:compile_sdk
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "io.dcloud.uniapp"  // UNIPACK_REPLACE:applicationId
        minSdk 21  // UNIPACK_REPLACE:min_sdk
        targetSdk 30  // UNIPACK_REPLACE:target_sdk
        versionCode 1  // UNIPACK_REPLACE:version_code
        versionName "1.0.0"  // UNIPACK_REPLACE:version_name
        multiDexEnabled true

        ndk {
            abiFilters 'x86', 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // UNIPACK_MANIFEST_PLACEHOLDERS: manifestPlaceholders will be injected here
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.keystore')  // UNIPACK_REPLACE:storeFile
            keyAlias 'release'  // UNIPACK_REPLACE:keyAlias
            keyPassword ''  // UNIPACK_ENCRYPT:keyPassword
            storePassword ''  // UNIPACK_ENCRYPT:storePassword
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file('../keystore/debug.keystore')  // UNIPACK_REPLACE:debugStoreFile
            keyAlias 'debug'  // UNIPACK_REPLACE:debugKeyAlias
            keyPassword ''  // UNIPACK_ENCRYPT:debugKeyPassword
            storePassword ''  // UNIPACK_ENCRYPT:debugStorePassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        jniLibs {
            useLegacyPackaging true
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// UNIPACK_DEPENDENCY_EXCLUDES: Dependency exclusion rules will be injected here

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    // UNIPACK_PLUGIN_PROJECT_DEPS: Plugin project dependencies will be injected here

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    // UNIPACK_EXTRA_DEPENDENCIES: Additional dependencies will be appended here

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
